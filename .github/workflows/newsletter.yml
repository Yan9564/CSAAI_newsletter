name: Agentic AI Newsletter

on:
  schedule:
    - cron: "0 13 * * 1"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Generate without committing changes"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]
      date_range_days:
        description: "Override configured arXiv date range"
        required: false
        type: string

permissions:
  contents: write

jobs:
  build-newsletter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -e .[dev]
      - name: Optional date-range override
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.date_range_days != '' }}
        run: |
          python - <<'PY'
          import os, yaml
          p='config/newsletter.yml'
          data=yaml.safe_load(open(p))
          data['search']['date_range_days']=int(os.environ['DAYS'])
          yaml.safe_dump(data, open(p,'w'), sort_keys=False)
          PY
        env:
          DAYS: ${{ github.event.inputs.date_range_days }}
      - name: Run tests
        run: pytest
      - name: Generate newsletter
        run: python -m csaainews.pipeline ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == 'true' && '--dry-run' || '' }}
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      - name: Commit newsletter
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.dry_run != 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md newsletters config/newsletter.yml
          if git diff --cached --quiet; then
            echo "No newsletter changes to commit."
          else
            git commit -m "Publish agentic AI newsletter"
            git push
          fi
